<main>
  <h2>Suppliers</h2>
  <p class="sub">Who deliveries come from.</p>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="suppliersMount"></div>
</main>

<script src="js/config.js?v=1"></script>
<script src="js/sheets.js?v=1"></script>
<script src="js/util.js?v=1"></script>
<script src="js/crud-page.js?v=1"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    return ok;
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    initCrudTable({
      mount: '#suppliersMount',
      title: 'Suppliers',
      tab: 'Suppliers',
      headers: ['ID', 'NAME', 'CONTACT', 'NOTES'],
      autoId: 'SUP',
      fields: [
        { key: 'NAME', label: 'Name', type: 'text', required: true },
        { key: 'CONTACT', label: 'Contact', type: 'text', placeholder: 'Phone, email, or account manager' },
        { key: 'NOTES', label: 'Notes', type: 'textarea' }
      ],
      sample: [
        ['', 'AMF/Odéon', 'orders@amf-odeon.example', ''],
        ['', 'Fen Farm Dairy', 'sales@fenfarmdairy.example', ''],
        ['', 'Valsana', 'uk@valsana.example', ''],
        ['', 'St Jude Cheese', 'hello@stjudecheese.example', '']
      ]
    });
  });
</script>
